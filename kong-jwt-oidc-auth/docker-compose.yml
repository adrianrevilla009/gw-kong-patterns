services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.2
    command: start-dev --import-realm
    environment:
      KC_HOSTNAME_URL: http://localhost:8080   # fixes the token "iss" claim that Kong matches on
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./realm-orders.json:/opt/keycloak/data/import/realm-orders.json:ro
  kong:
    image: kong:3.7.1
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
    volumes:
      - ./kong.generated.yml:/kong/kong.yml:ro   # rendered by verify.sh from kong.template.yml
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      retries: 12
  orders:
    image: traefik/whoami:v1.10.2
